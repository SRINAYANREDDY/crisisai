name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Override gradle.properties for cloud build
        run: |
          cat > android/gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.configureondemand=false
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-tree-shake-icons || true

      - name: Find and copy APK
        run: |
          echo "=== All APKs found ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== Copying APK ==="
          APK=$(find . -name "app-release.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mkdir -p output
            cp "$APK" output/app-release.apk
            echo "Copied from: $APK"
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
