name: crisis_ai
description: "CrisisAI — Citizen Hero Network. AI-powered community disaster response platform."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # ── Google Maps (replaces flutter_map + latlong2) ───────────────────────────
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.12+2 # downgraded for Dart 3.6 compatibility

  # ── Location ────────────────────────────────────────────────────────────────
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # ── Networking ──────────────────────────────────────────────────────────────
  http: ^1.2.1
  dio: ^5.9.2
  web_socket_channel: ^3.0.0 # Gemini Live API

  # ── AI / ML Kit ─────────────────────────────────────────────────────────────
  google_mlkit_object_detection: ^0.14.0
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_commons: ^0.9.0

  # ── Camera & Media ──────────────────────────────────────────────────────────
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # ── Audio / Voice ───────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0
  record: ^6.0.0
  flutter_tts: ^4.0.0

  # ── Storage & Connectivity ──────────────────────────────────────────────────
  shared_preferences: ^2.2.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3

  # ── UI & Utilities ──────────────────────────────────────────────────────────
  url_launcher: ^6.3.1
  dash_chat_2: ^0.0.21
  crypto: ^3.0.3
  permission_handler: ^11.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  google_mlkit_commons: ^0.9.0

flutter:
  uses-material-design: true
